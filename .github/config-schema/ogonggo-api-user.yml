##
# ogonggo-api-user 운영 설정 계약.
#
# GitHub 시크릿 APPLICATION_SECRET_USER 의 내용이 이 계약을 지키는지 배포 전에 검사한다.
# 검사기는 .github/scripts/validate_application_yml.py 다.
#
# 코드에서 설정 키를 추가하거나 이름을 바꾸면 이 파일도 같은 작업에서 고친다.
# 계약에 없는 키가 설정 파일에 있으면 배포가 멈춘다. 들여쓰기 사고를 잡기 위한 의도된 동작이다.
##
module: ogonggo-api-user

# 잎 키가 아래 접두사 중 하나로 시작하지 않으면 오타이거나 들여쓰기가 어긋난 것으로 본다.
# 예: `spring.data.redis.host` 가 한 단계 밀려 `spring.jpa.properties.data.redis.host` 가 되면
# 여기에 걸린다. 이 모듈이 쓰지 않는 것은 일부러 넣지 않는다.
allowed-prefixes:
  - spring.application.name
  - spring.datasource
  # spring.jpa 전체를 열지 않는다. spring.jpa.properties 는 Hibernate 전용 자유 영역이라
  # 통째로 허용하면 그 아래로 밀려 들어간 키(예: data.redis)를 잡을 수 없다.
  - spring.jpa.open-in-view
  - spring.jpa.show-sql
  - spring.jpa.database-platform
  - spring.jpa.hibernate
  - spring.jpa.properties.hibernate
  - spring.mail.host
  - spring.mail.port
  - spring.mail.protocol
  - spring.mail.username
  - spring.mail.password
  - spring.mail.default-encoding
  - spring.mail.properties.mail
  - spring.data.redis
  - spring.threads
  - spring.lifecycle
  - ogonggo.auth.jwt
  - ogonggo.letscareer
  - ogonggo.advertisement
  - server
  - springdoc
  - logging

rules:
  - path: spring.application.name
    equals: ogonggo-api-user

  # 운영은 RDS를 본다. 로컬 값이 그대로 넘어오면 컨테이너가 DB에 붙지 못하고 죽는다.
  - path: spring.datasource.url
    pattern: '^jdbc:mysql://[^/\s]+:\d+/\S+'
    forbid-substrings: [ localhost, 127.0.0.1, ' ' ]
    reason: 'RDS 엔드포인트를 가리키는 jdbc:mysql URL 이어야 합니다.'
  - path: spring.datasource.username
  - path: spring.datasource.password
    sensitive: true
    min-length: 8
  - path: spring.datasource.driver-class-name
    required: false
    equals: com.mysql.cj.jdbc.Driver

  # OSIV는 아키텍처 문서에서 끄기로 정했다. 켜진 채 배포되면 커넥션이 요청 내내 붙잡힌다.
  - path: spring.jpa.open-in-view
    type: bool
    equals: false
    reason: 'docs/architecture/layers-and-modules.md 의 OSIV 규칙입니다.'
  - path: spring.jpa.hibernate.ddl-auto
    one-of: [ update, validate, none ]
    reason: 'create/create-drop 은 운영 데이터를 지웁니다.'

  # 광고 문의 접수 메일이 JavaMailSender 를 주입받는다.
  # spring.mail.host 가 없으면 빈 자체가 만들어지지 않아 애플리케이션이 뜨지 않는다.
  - path: spring.mail.host
    pattern: '^[A-Za-z0-9.-]+$'
    reason: 'JavaMailSender 빈 생성 조건입니다. 없으면 컨텍스트 로딩이 실패합니다.'
  - path: spring.mail.port
    type: int
  - path: spring.mail.username
    sensitive: true
  - path: spring.mail.password
    sensitive: true
    min-length: 16

  - path: spring.data.redis.host
    forbid-substrings: [ localhost, 127.0.0.1, ' ' ]
    reason: '리프레시 토큰 저장소입니다. ElastiCache 엔드포인트여야 합니다.'
  - path: spring.data.redis.port
    type: int

  # jjwt 는 HS512 키가 512비트(64바이트) 미만이면 빈을 만들 때 예외를 던진다.
  # 짧은 시크릿을 넣으면 빌드는 통과하고 컨테이너만 죽는다.
  - path: ogonggo.auth.jwt.secret
    sensitive: true
    type: base64
    min-decoded-bytes: 64
    reason: 'HS512 서명 키입니다. Base64 로 디코딩해 64바이트 이상이어야 합니다.'
  - path: ogonggo.auth.jwt.access-token-validity
    required: false
    type: duration
  - path: ogonggo.auth.jwt.refresh-token-validity
    required: false
    type: duration

  - path: ogonggo.letscareer.base-url
    pattern: '^https?://'
    forbid-substrings: [ localhost, 127.0.0.1, ' ' ]
    reason: '렛츠커리어 서버 주소입니다. 로컬 주소면 로그인이 전부 실패합니다.'
  - path: ogonggo.letscareer.internal-api-key
    sensitive: true
    min-length: 32
  - path: ogonggo.letscareer.connect-timeout
    required: false
    type: duration
  - path: ogonggo.letscareer.read-timeout
    required: false
    type: duration

  # 코드가 빈 값을 허용하므로 필수는 아니다. 다만 값이 있으면 형식은 맞아야 한다.
  - path: ogonggo.advertisement.mail.from
    required: false
    pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  - path: ogonggo.advertisement.slack.inquiry-url
    required: false
    sensitive: true
    pattern: '^https://hooks\.slack\.com/services/'
    reason: '슬랙 인커밍 웹훅 URL 형식이 아닙니다.'
  - path: ogonggo.advertisement.slack.connect-timeout
    required: false
    type: duration
  - path: ogonggo.advertisement.slack.read-timeout
    required: false
    type: duration

  # ALB 타겟 그룹과 Dockerfile EXPOSE 가 8080 이다. 여기서 어긋나면 헬스 체크가 전부 실패한다.
  - path: server.port
    type: int
    equals: 8080
  - path: server.shutdown
    equals: graceful
    reason: '롤링 업데이트 중 처리 중인 요청을 끊지 않기 위한 설정입니다.'

  # OpenAPI 계약 테스트가 이 값을 전제로 /health 를 문서에서 제외한다.
  - path: springdoc.paths-to-match
    equals: /api/**

forbidden-paths:
  - path: spring.mail.from
    reason: 'Spring 표준 키가 아니라 무시됩니다. 발신 주소는 ogonggo.advertisement.mail.from 입니다.'
  - path: spring.jpa.properties.data.redis.host
    reason: '들여쓰기가 어긋났습니다. Redis 설정은 spring.data.redis 아래에 둡니다.'
