##
# ECS 배포 공용 워크플로.
#
# ogonggo-api-user와 ogonggo-api-admin은 독립 배포 경계를 갖지만 배포 절차는 동일하다.
# 절차를 한 곳에만 두기 위해 재사용 워크플로로 분리하고, 호출자(deploy-main.yml)가
# 모듈별 시크릿을 주입한다.
#
# 배포 방식은 ECS 롤링 업데이트다. CodeDeploy blue/green이 아니므로
# ALB 타겟 그룹은 서비스당 하나만 있으면 된다.
#
# ── 검증 순서 ────────────────────────────────────────────────────────────────
# 잘못된 시크릿이 운영 서비스를 죽이지 못하게, 되돌리기 어려운 단계일수록 뒤에 둔다.
# 앞의 단계가 실패하면 ECR에 이미지를 올리지도, ECS를 건드리지도 않는다.
#
#   1. 필수 시크릿 확인        비었거나 공백이 섞인 시크릿을 잡는다
#   2. AWS 자격 증명·리소스 확인 잘못된 키, 없는 클러스터/서비스/리포지토리를 잡는다
#   3. 태스크 정의 점검         컨테이너 이름과 참조 시크릿을 잡는다
#   4. jar·이미지 빌드          여기까지는 AWS 상태를 바꾸지 않는다
#   5. 컨테이너 기동 검증        운영 설정으로 컨테이너를 띄워 /health 200을 확인한다
#   6. ECR 푸시 → ECS 배포 → 스모크 테스트
#   7. 실패하면 이전 태스크 정의로 자동 롤백
#
# 설정 파일(application.yml)의 내용은 배포 전에 따로 검사하지 않는다. 설정은 코드와 함께 바뀌고,
# 키가 잘못된 자리에 들어가도 스프링은 그 키를 무시하고 기본값으로 뜨므로 파일만 봐서는 가려낼 수 없다.
# 설정이 틀려 컨텍스트가 뜨지 않으면 5번이, 뜨더라도 운영에서 동작하지 않으면 6번과 7번이 드러낸다.
# 러너에서 VPC 안의 RDS·ElastiCache에는 닿을 수 없으므로, 기동 검증은 CI가 띄운
# MySQL·Redis 컨테이너를 보게 하고 접속 정보만 환경변수로 덮어쓴다.
##
name: Deploy to Amazon ECS (reusable)

on:
  workflow_call:
    inputs:
      module:
        description: 'Gradle 모듈 디렉터리 이름 (예: ogonggo-api-user)'
        required: true
        type: string
      aws-region:
        description: 'AWS 리전'
        required: false
        type: string
        default: 'ap-northeast-2'
      health-check-url:
        description: '배포 후 확인할 헬스 체크 URL. 비우면 스모크 테스트를 건너뛴다'
        required: false
        type: string
        default: ''
      startup-verification:
        description: '이미지를 푸시하기 전에 운영 설정 그대로 컨테이너를 띄워 볼지 여부'
        required: false
        type: boolean
        default: true
      rollback-on-failure:
        description: '배포나 스모크 테스트가 실패하면 이전 태스크 정의로 되돌릴지 여부'
        required: false
        type: boolean
        default: true
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      ECR_REPOSITORY:
        required: true
      ECS_CLUSTER:
        required: true
      ECS_SERVICE:
        required: true
      CONTAINER_NAME:
        required: true
      APPLICATION_SECRET:
        required: true

permissions:
  contents: read

env:
  CONFIG_FILE: ${{ inputs.module }}/src/main/resources/application.yml

jobs:
  deploy:
    name: Deploy ${{ inputs.module }}
    runs-on: ubuntu-latest
    # 배포에 승인 단계를 걸려면 저장소 설정에 Environment를 만들고
    # 여기에 environment: <이름>을 추가한다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub은 등록되지 않은 시크릿을 조용히 빈 문자열로 바꾼다.
      # workflow_call의 `required: true`는 호출자가 값을 넘겼는지만 보고 내용은 보지 않으므로,
      # 시크릿 이름을 오타 냈거나 아직 등록하지 않았어도 배포가 그대로 진행된다.
      # 여기서 값이 실제로 들어왔는지, 붙여 넣다 공백이 섞이지 않았는지 확인한다.
      - name: 필수 시크릿 확인
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET }}
        run: |
          set -u
          failed=0

          # 값을 절대 출력하지 않는다. 이름과 무엇이 틀렸는지만 남긴다.
          require_present() {
            if [ -z "${2:-}" ]; then
              echo "::error::시크릿 $1 이 비어 있습니다. 저장소 시크릿에 등록되어 있는지, 이름을 정확히 넘겼는지 확인하세요."
              failed=1
              return 1
            fi
          }

          require_single_line() {
            case "$2" in
              *' '*|*"$(printf '\t')"*)
                echo "::error::시크릿 $1 에 공백이나 탭이 들어 있습니다. 붙여 넣을 때 섞인 것 같습니다."
                failed=1
                ;;
            esac
            if [ "$(printf '%s' "$2" | wc -l | tr -d ' ')" != "0" ]; then
              echo "::error::시크릿 $1 이 여러 줄입니다. 한 줄 값이어야 합니다."
              failed=1
            fi
          }

          require_pattern() {
            if ! printf '%s' "$2" | grep -Eq "$3"; then
              echo "::error::시크릿 $1 의 형식이 올바르지 않습니다. $4"
              failed=1
            fi
          }

          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE CONTAINER_NAME APPLICATION_SECRET; do
            value="${!name}"
            require_present "$name" "$value" || continue
            if [ "$name" != "APPLICATION_SECRET" ]; then
              require_single_line "$name" "$value"
            fi
          done

          # 자격 증명은 형식만으로도 잘린 값과 잘못 붙여 넣은 값을 상당수 걸러낸다.
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            require_pattern AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID" '^[A-Z0-9]{16,128}$' \
              'AKIA 로 시작하는 대문자·숫자 16자 이상이어야 합니다.'
          fi
          if [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            require_pattern AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY" '^.{40}$' \
              '40자여야 합니다. 값이 잘렸는지 확인하세요.'
          fi
          if [ -n "$ECR_REPOSITORY" ]; then
            # ECR 리포지토리 이름에는 점과 슬래시가 들어갈 수 있어서(네임스페이스) 문자 종류만으로는
            # 레지스트리 URL 전체를 붙여 넣은 경우를 구분하지 못한다. 레지스트리 호스트를 따로 본다.
            require_pattern ECR_REPOSITORY "$ECR_REPOSITORY" '^[a-z0-9][a-z0-9._/-]*$' \
              '소문자나 숫자로 시작하는 리포지토리 이름이어야 합니다.'
            if printf '%s' "$ECR_REPOSITORY" | grep -qE 'amazonaws\.com|dkr\.ecr|^https?://'; then
              echo "::error::시크릿 ECR_REPOSITORY 에 레지스트리 주소가 들어 있습니다. 리포지토리 '이름'만 넣습니다(예: ogonggo-api-user)."
              failed=1
            fi
          fi

          # 사용자·관리자 시크릿을 서로 바꿔 넣는 사고를 잡는다.
          case "$CONTAINER_NAME" in
            *user*|*admin*)
              expected="${{ inputs.module }}"
              case "$expected" in
                *user*) echo "$CONTAINER_NAME" | grep -q admin && { echo "::error::CONTAINER_NAME 이 admin 을 가리키는데 배포 대상은 $expected 입니다."; failed=1; } ;;
                *admin*) echo "$CONTAINER_NAME" | grep -q user && { echo "::error::CONTAINER_NAME 이 user 를 가리키는데 배포 대상은 $expected 입니다."; failed=1; } ;;
              esac
              ;;
          esac

          [ "$failed" -eq 0 ] || exit 1
          echo "필수 시크릿 확인을 통과했습니다."

      # application.yml은 저장소에 없다. GitHub Environment 시크릿의 내용을 그대로 기록한다.
      # echo는 백슬래시와 선행 하이픈 처리에서 문제가 생기므로 printf '%s'를 사용한다.
      - name: 운영 설정 파일 생성
        env:
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET }}
        run: |
          mkdir -p "$(dirname "$CONFIG_FILE")"
          printf '%s' "$APPLICATION_SECRET" > "$CONFIG_FILE"

      # 검사가 아니며 배포를 막지 않는다. 기동 검증이 실패하면 컨테이너 로그를 출력하는데,
      # 그때 비밀번호나 키가 찍히지 않도록 키 이름이 민감해 보이는 값을 ::add-mask:: 로 등록해 둔다.
      - name: 민감한 설정 값 가리기
        run: python3 .github/scripts/mask_application_secrets.py --file "$CONFIG_FILE"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      # configure-aws-credentials 는 값을 설정만 하고 유효한지 확인하지 않는다.
      # 만료되었거나 잘못된 키는 첫 AWS 호출에서야 드러나는데, 그때는 이미 이미지를 다 만든 뒤다.
      - name: AWS 자격 증명 확인
        run: |
          if ! aws sts get-caller-identity --query Arn --output text; then
            echo "::error::AWS 자격 증명이 유효하지 않습니다. AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 를 확인하세요."
            exit 1
          fi

      # 없는 리소스를 가리키는 시크릿은 배포 마지막 단계에서야 실패한다.
      # 그전에 ECR 푸시가 끝나 있어 롤백 판단이 복잡해지므로 여기서 미리 확인한다.
      - name: 배포 대상 리소스 확인
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          failed=0

          # 배포 계정에 조회 권한이 없을 수도 있다. 권한 문제는 배포를 막을 이유가 아니므로
          # "없다"와 "볼 수 없다"를 구분해서, 없을 때만 실패로 처리한다.
          if ! ERR=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" 2>&1 >/dev/null); then
            if printf '%s' "$ERR" | grep -q 'RepositoryNotFoundException'; then
              echo "::error::ECR 리포지토리 '$ECR_REPOSITORY' 가 없습니다. ECR_REPOSITORY 시크릿을 확인하세요."
              failed=1
            else
              echo "::notice::ECR 리포지토리를 확인하지 못했습니다(권한 부족으로 보입니다). 푸시 단계에서 다시 드러납니다."
            fi
          fi

          STATUS=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo "None")
          if [ "$STATUS" != "ACTIVE" ]; then
            echo "::error::클러스터 '$CLUSTER' 에서 서비스 '$SERVICE' 를 찾지 못했거나 ACTIVE 가 아닙니다(status=$STATUS). ECS_CLUSTER / ECS_SERVICE 시크릿을 확인하세요."
            failed=1
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "배포 대상 리소스를 확인했습니다."

      # 태스크 정의는 저장소에 두지 않고 이미지만 교체해 새 리비전을 등록한다.
      # 콘솔에서 CPU·메모리·환경변수를 바꿔도 배포가 그 값을 덮어쓰지 않는다.
      #
      # 기준은 패밀리의 최신 리비전이 아니라 서비스가 지금 실행 중인 리비전이다.
      # 콘솔에서 이전 리비전으로 롤백해 둔 상태에서 다시 배포할 때,
      # 패밀리 최신(불량일 수 있는) 리비전을 기반으로 삼는 것을 막는다.
      #
      # 여기서 얻은 ARN은 배포가 실패했을 때 되돌릴 지점이기도 하다.
      - name: 현재 태스크 정의 내려받기
        id: current-task-def
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
            echo "::error::서비스 $SERVICE 의 태스크 정의를 찾지 못했습니다."
            exit 1
          fi
          echo "기준 태스크 정의: $TASK_DEF_ARN"
          echo "arn=$TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition \
            > task-definition-raw.json
          jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )' task-definition-raw.json > task-definition.json

      # CONTAINER_NAME 이 태스크 정의에 없으면 이미지 교체가 조용히 빗나가고,
      # 태스크 정의가 참조하는 SSM·Secrets Manager 값이 없으면 태스크가 기동 중에 죽는다.
      # 둘 다 배포 뒤에야 드러나는 사고라 미리 확인한다.
      - name: 태스크 정의 점검
        env:
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
        run: |
          failed=0

          NAMES=$(jq -r '.containerDefinitions[].name' task-definition.json)
          if ! printf '%s\n' "$NAMES" | grep -qx "$CONTAINER_NAME"; then
            echo "::error::태스크 정의에 컨테이너 '$CONTAINER_NAME' 이 없습니다. 정의된 이름: $(printf '%s' "$NAMES" | tr '\n' ' ')"
            failed=1
          fi

          # 태스크 정의가 외부 시크릿을 참조한다면 그 값이 실제로 존재하는지 본다.
          # 없으면 이미지가 아무리 정상이어도 태스크가 기동 중에 죽는다.
          # 권한이 없어 확인하지 못하는 경우는 실패로 보지 않고 알림만 남긴다.
          check_reference() {
            if ERR=$("$@" 2>&1 >/dev/null); then
              return 0
            fi
            if printf '%s' "$ERR" | grep -qiE 'ParameterNotFound|ResourceNotFoundException|can not be found'; then
              return 1
            fi
            echo "::notice::참조 '$REF' 를 확인하지 못했습니다(권한 부족으로 보입니다)."
            return 0
          }

          for REF in $(jq -r '[.containerDefinitions[].secrets // []] | flatten | .[].valueFrom' task-definition.json); do
            case "$REF" in
              arn:aws:ssm:*:parameter/*)
                param="/${REF#*:parameter/}"
                if ! check_reference aws ssm get-parameter --name "$param" --with-decryption; then
                  echo "::error::태스크 정의가 참조하는 SSM 파라미터 '$param' 가 없습니다. 태스크가 기동 중 죽습니다."
                  failed=1
                fi
                ;;
              arn:aws:secretsmanager:*)
                if ! check_reference aws secretsmanager describe-secret --secret-id "$REF"; then
                  echo "::error::태스크 정의가 참조하는 시크릿 '$REF' 가 없습니다. 태스크가 기동 중 죽습니다."
                  failed=1
                fi
                ;;
              *)
                echo "::notice::참조 '$REF' 는 형식을 알 수 없어 확인하지 않았습니다."
                ;;
            esac
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "태스크 정의 점검을 통과했습니다."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-java의 cache 옵션은 의존성만 캐시한다. Gradle 공식 액션은
      # 빌드 캐시까지 복원하므로 gradle.properties의 org.gradle.caching=true가 실제로 효과를 낸다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # jar는 러너에서 만든다. Gradle 의존성이 캐시되어 두 번째 배포부터 크게 빨라진다.
      # 설정 파일 생성 단계 뒤에 있어야 application.yml이 jar에 포함된다.
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew :${{ inputs.module }}:bootJar --no-daemon

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Dockerfile은 위에서 만든 jar를 복사만 한다. 컨테이너 안에서 Gradle을 돌리지 않는다.
      # 여기서는 빌드만 하고 푸시하지 않는다. 기동 검증을 통과한 이미지만 ECR로 올린다.
      - name: 이미지 빌드
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f "${{ inputs.module }}/Dockerfile" \
            --build-arg JAR_FILE="${{ inputs.module }}/build/libs/${{ inputs.module }}.jar" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # 방금 만든 이미지를 운영 설정으로 실제로 띄워
      # 스프링 컨텍스트가 끝까지 올라오는지 본다. 빈 생성 실패, @ConfigurationProperties 바인딩
      # 실패, 짧은 JWT 키처럼 기동 시점에만 드러나는 오류가 여기서 걸린다.
      #
      # 러너는 VPC 안의 RDS·ElastiCache에 닿을 수 없다. 그래서 접속 대상만 CI 컨테이너로 덮어쓴다.
      # 운영 접속 정보가 맞는지는 여기서 확인할 수 없고, 실제 연결은 배포 뒤 스모크 테스트가 확인한다.
      # 포트도 8080 으로 덮어쓴다. 설정 파일의 server.port 와 무관하게 기동 여부만 본다.
      # 실제 컨테이너 포트가 태스크 정의·ALB 타겟 그룹과 맞는지는 스모크 테스트가 확인한다.
      # ddl-auto도 덮어쓴다. 운영이 validate여도 빈 CI DB에는 스키마가 없기 때문이다.
      # 덕분에 JPA 매핑으로 스키마를 만들 수 있는지까지 함께 확인된다.
      - name: 컨테이너 기동 검증
        if: inputs.startup-verification
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          set -e
          docker network create ogonggo-ci >/dev/null

          docker run -d --name ci-mysql --network ogonggo-ci \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=ogonggo \
            -e MYSQL_USER=ogonggo \
            -e MYSQL_PASSWORD=ogonggo \
            -e TZ=Asia/Seoul \
            --health-cmd "mysqladmin ping -h localhost -proot" \
            --health-interval 5s --health-timeout 5s --health-retries 30 \
            mysql:8.0 >/dev/null

          docker run -d --name ci-redis --network ogonggo-ci \
            redis:7.2 redis-server --appendonly no >/dev/null

          echo "MySQL 준비를 기다립니다."
          for _ in $(seq 1 40); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' ci-mysql)" = "healthy" ]; then
              break
            fi
            sleep 3
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' ci-mysql)" != "healthy" ]; then
            echo "::error::검증용 MySQL 이 준비되지 않았습니다. 러너 문제이므로 다시 실행해 보세요."
            exit 1
          fi

          docker run -d --name ci-app --network ogonggo-ci -p 18080:8080 \
            -e SERVER_PORT=8080 \
            -e SPRING_DATASOURCE_URL="jdbc:mysql://ci-mysql:3306/ogonggo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8" \
            -e SPRING_DATASOURCE_USERNAME=ogonggo \
            -e SPRING_DATASOURCE_PASSWORD=ogonggo \
            -e SPRING_DATA_REDIS_HOST=ci-redis \
            -e SPRING_DATA_REDIS_PORT=6379 \
            -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
            "$IMAGE" >/dev/null

          echo "애플리케이션 기동을 기다립니다."
          ok=0
          for _ in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Running}}' ci-app)" != "true" ]; then
              echo "::error::컨테이너가 종료되었습니다. 애플리케이션이 기동 중 죽습니다."
              break
            fi
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://localhost:18080/health || true)
            if [ "$CODE" = "200" ]; then
              ok=1
              break
            fi
            sleep 3
          done

          if [ "$ok" != "1" ]; then
            echo "::group::기동 실패 로그"
            docker logs ci-app 2>&1 | tail -n 200
            echo "::endgroup::"
            echo "::error::운영 설정으로 애플리케이션이 기동하지 못했습니다. 이미지를 푸시하지 않고 중단합니다. 위 로그에서 원인 설정 키를 확인하세요."
            exit 1
          fi

          echo "기동 검증을 통과했습니다. /health 가 200을 반환했습니다."

      - name: 기동 검증 컨테이너 정리
        if: always()
        run: |
          docker rm -f ci-app ci-mysql ci-redis >/dev/null 2>&1 || true
          docker network rm ogonggo-ci >/dev/null 2>&1 || true

      # 여기서부터 되돌리기 어려운 단계다. 앞의 검사를 모두 통과한 이미지만 올라온다.
      - name: 이미지 푸시
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        id: ecs-deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ECS 배포 성공은 태스크가 떴다는 뜻일 뿐이다. 실제로 200을 주는지까지 확인한다.
      - name: 스모크 테스트
        id: smoke
        if: inputs.health-check-url != ''
        env:
          URL: ${{ inputs.health-check-url }}
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          DESIRED=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].desiredCount' --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "::notice::원하는 태스크 수가 0이라 스모크 테스트를 건너뜁니다."
            exit 0
          fi
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            echo "시도 $i/10: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "스모크 테스트 통과"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$URL 이 200을 반환하지 않았습니다."
          exit 1

      # 앞의 검사를 모두 통과하고도 배포가 실패했다면, 러너에서는 재현할 수 없는 원인
      # (VPC 안의 DB 접속 실패, 보안 그룹, 태스크 역할 권한 등)이다.
      # 새 리비전을 그대로 두면 서비스가 죽은 채로 남으므로 직전 리비전으로 되돌린다.
      - name: 실패 시 이전 태스크 정의로 롤백
        if: |
          failure() && inputs.rollback-on-failure &&
          (steps.ecs-deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
          PREVIOUS_TASK_DEF: ${{ steps.current-task-def.outputs.arn }}
          URL: ${{ inputs.health-check-url }}
        run: |
          echo "::warning::배포가 실패해 이전 태스크 정의로 되돌립니다: $PREVIOUS_TASK_DEF"
          aws ecs update-service \
            --cluster "$CLUSTER" --service "$SERVICE" \
            --task-definition "$PREVIOUS_TASK_DEF" \
            --force-new-deployment >/dev/null

          if ! aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"; then
            echo "::error::롤백이 안정 상태에 도달하지 못했습니다. 콘솔에서 직접 확인하세요."
            exit 1
          fi

          if [ -n "$URL" ]; then
            for i in $(seq 1 10); do
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
              echo "롤백 확인 $i/10: HTTP $CODE"
              if [ "$CODE" = "200" ]; then
                echo "::warning::이전 리비전으로 복구했습니다. 배포는 실패로 남깁니다."
                exit 0
              fi
              sleep 6
            done
            echo "::error::롤백 후에도 $URL 이 200을 반환하지 않습니다. 콘솔에서 직접 확인하세요."
            exit 1
          fi

          echo "::warning::이전 리비전으로 되돌렸습니다."
