##
# ECS 배포 공용 워크플로.
#
# ogonggo-api-user와 ogonggo-api-admin은 독립 배포 경계를 갖지만 배포 절차는 동일하다.
# 절차를 한 곳에만 두기 위해 재사용 워크플로로 분리하고, 호출자(deploy-main.yml)가
# 모듈별 시크릿을 주입한다.
#
# 배포 방식은 ECS 롤링 업데이트다. CodeDeploy blue/green이 아니므로
# ALB 타겟 그룹은 서비스당 하나만 있으면 된다.
##
name: Deploy to Amazon ECS (reusable)

on:
  workflow_call:
    inputs:
      module:
        description: 'Gradle 모듈 디렉터리 이름 (예: ogonggo-api-user)'
        required: true
        type: string
      aws-region:
        description: 'AWS 리전'
        required: false
        type: string
        default: 'ap-northeast-2'
      health-check-url:
        description: '배포 후 확인할 헬스 체크 URL. 비우면 스모크 테스트를 건너뛴다'
        required: false
        type: string
        default: ''
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      ECR_REPOSITORY:
        required: true
      ECS_CLUSTER:
        required: true
      ECS_SERVICE:
        required: true
      CONTAINER_NAME:
        required: true
      APPLICATION_SECRET:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.module }}
    runs-on: ubuntu-latest
    # 배포에 승인 단계를 걸려면 저장소 설정에 Environment를 만들고
    # 여기에 environment: <이름>을 추가한다.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # application.yml은 저장소에 없다. GitHub Environment 시크릿의 내용을 그대로 기록한다.
      # echo는 백슬래시와 선행 하이픈 처리에서 문제가 생기므로 printf '%s'를 사용한다.
      - name: 운영 설정 파일 생성
        env:
          APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET }}
        run: |
          mkdir -p "${{ inputs.module }}/src/main/resources"
          printf '%s' "$APPLICATION_SECRET" > "${{ inputs.module }}/src/main/resources/application.yml"

      # 시크릿이 비었거나 잘린 채로 이미지가 빌드되는 사고를 막는 최소 확인.
      - name: 설정 파일 유효성 확인
        run: |
          FILE="${{ inputs.module }}/src/main/resources/application.yml"
          test -s "$FILE" || { echo "::error::$FILE 이 비어 있습니다. APPLICATION_SECRET을 확인하세요."; exit 1; }
          grep -q '^spring:' "$FILE" || { echo "::error::$FILE 에 spring 설정이 없습니다. APPLICATION_SECRET 내용을 확인하세요."; exit 1; }
          if grep -q 'CHANGE_ME' "$FILE"; then
            echo "::error::$FILE 에 CHANGE_ME가 남아 있습니다."
            exit 1
          fi
          # 문서 편집기에서 복사하면서 들여쓰기가 깨지는 사고를 잡는다.
          if command -v ruby >/dev/null 2>&1; then
            ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$FILE" \
              || { echo "::error::$FILE 이 올바른 YAML이 아닙니다. 들여쓰기를 확인하세요."; exit 1; }
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # setup-java의 cache 옵션은 의존성만 캐시한다. Gradle 공식 액션은
      # 빌드 캐시까지 복원하므로 gradle.properties의 org.gradle.caching=true가 실제로 효과를 낸다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # jar는 러너에서 만든다. Gradle 의존성이 캐시되어 두 번째 배포부터 크게 빨라진다.
      # 설정 파일 생성 단계 뒤에 있어야 application.yml이 jar에 포함된다.
      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew :${{ inputs.module }}:bootJar --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Dockerfile은 위에서 만든 jar를 복사만 한다. 컨테이너 안에서 Gradle을 돌리지 않는다.
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f "${{ inputs.module }}/Dockerfile" \
            --build-arg JAR_FILE="${{ inputs.module }}/build/libs/${{ inputs.module }}.jar" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # 태스크 정의는 저장소에 두지 않고 이미지만 교체해 새 리비전을 등록한다.
      # 콘솔에서 CPU·메모리·환경변수를 바꿔도 배포가 그 값을 덮어쓰지 않는다.
      #
      # 기준은 패밀리의 최신 리비전이 아니라 서비스가 지금 실행 중인 리비전이다.
      # 콘솔에서 이전 리비전으로 롤백해 둔 상태에서 다시 배포할 때,
      # 패밀리 최신(불량일 수 있는) 리비전을 기반으로 삼는 것을 막는다.
      - name: 현재 태스크 정의 내려받기
        env:
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].taskDefinition' --output text)
          if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
            echo "::error::서비스 $SERVICE 의 태스크 정의를 찾지 못했습니다."
            exit 1
          fi
          echo "기준 태스크 정의: $TASK_DEF_ARN"
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition \
            > task-definition-raw.json
          jq 'del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )' task-definition-raw.json > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ secrets.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true

      # ECS 배포 성공은 태스크가 떴다는 뜻일 뿐이다. 실제로 200을 주는지까지 확인한다.
      # 실패해도 자동 롤백은 하지 않는다. 배포는 이미 적용된 상태이므로 사람이 판단한다.
      - name: 스모크 테스트
        if: inputs.health-check-url != ''
        env:
          URL: ${{ inputs.health-check-url }}
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          DESIRED=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" \
            --query 'services[0].desiredCount' --output text)
          if [ "$DESIRED" = "0" ]; then
            echo "::notice::원하는 태스크 수가 0이라 스모크 테스트를 건너뜁니다."
            exit 0
          fi
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || true)
            echo "시도 $i/10: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "스모크 테스트 통과"
              exit 0
            fi
            sleep 6
          done
          echo "::error::$URL 이 200을 반환하지 않았습니다. 배포는 이미 적용되었으니 롤백이 필요한지 확인하세요."
          exit 1
