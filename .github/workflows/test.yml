name: Test

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 의존성뿐 아니라 Gradle 빌드 캐시까지 복원한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 운영 설정(application.yml)은 gitignore 대상이라 PR 빌드에 존재하지 않는다.
      # 테스트는 각 모듈의 src/test/resources/application.yml만으로 동작해야 한다.
      - name: Test with Gradle
        run: ./gradlew test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

  # 배포 워크플로가 쓰는 스크립트와 워크플로 문법을 PR에서 확인한다.
  # 운영 시크릿 없이 도는 검사라 PR 빌드에서 안전하게 실행할 수 있다.
  deploy-checks:
    name: Deploy checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 기동 검증 로그에 시크릿이 찍히지 않도록 가리는 스크립트가 실제로 값을 가리는지 확인한다.
      - name: 시크릿 마스킹 스크립트 테스트
        run: python3 .github/scripts/test_mask_application_secrets.py

      # 배포 워크플로 자체의 문법·표현식 오류는 main에 머지된 뒤에야 드러난다.
      # 그때는 배포가 통째로 멈추므로 PR에서 미리 본다.
      - name: 워크플로 정적 검사
        uses: raven-actions/actionlint@v2
        with:
          files: '.github/workflows/*.yml'
