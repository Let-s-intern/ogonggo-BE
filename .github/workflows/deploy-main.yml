##
# main 브랜치 운영 배포.
#
# 두 API는 하나의 DB를 공유하지만 운영 ddl-auto가 모두 none이라 기동하면서 스키마를
# 바꾸지 않는다. 그래서 user와 admin을 서로 기다리지 않고 병렬로 배포한다.
# 스키마 변경은 docs/schema의 SQL을 배포 전에 적용해 둔다.
#
# 시크릿은 저장소(Repository) 시크릿으로 등록한다. 재사용 워크플로에 넘길 값은
# 호출자 컨텍스트에서 평가되므로 Environment 시크릿에 두면 해석되지 않는다.
##
name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      target:
        description: '배포 대상'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - user
          - admin

permissions:
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  user:
    name: ogonggo-api-user
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'user'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      module: ogonggo-api-user
      health-check-url: http://ogonggo-alb-1441877515.ap-northeast-2.elb.amazonaws.com/health
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_USER }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE_USER }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME_USER }}
      APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET_USER }}

  admin:
    name: ogonggo-api-admin
    if: github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'admin'
    uses: ./.github/workflows/deploy-ecs.yml
    with:
      module: ogonggo-api-admin
      # 도메인과 HTTPS 리스너가 준비되면 8081 대신 그 주소로 바꾼다.
      health-check-url: http://ogonggo-alb-1441877515.ap-northeast-2.elb.amazonaws.com:8081/health
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_ADMIN }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.ECS_SERVICE_ADMIN }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME_ADMIN }}
      APPLICATION_SECRET: ${{ secrets.APPLICATION_SECRET_ADMIN }}
