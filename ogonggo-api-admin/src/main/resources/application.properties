# Keep the user API and administrator JSON/CSV on one reporting source.
ogonggo.advertisement-report.source=${ADVERTISEMENT_REPORT_SOURCE:MYSQL}

# PostHog Endpoints private read-only call. Never place this credential in the frontend.
ogonggo.posthog.endpoints.api-host=${POSTHOG_API_HOST:https://us.posthog.com}
ogonggo.posthog.endpoints.project-id=${POSTHOG_PROJECT_ID:}
ogonggo.posthog.endpoints.endpoint-name=${POSTHOG_ENDPOINT_NAME:advertisement-contract-report}
ogonggo.posthog.endpoints.api-key=${POSTHOG_ENDPOINT_KEY:}
ogonggo.posthog.endpoints.report-version=${POSTHOG_ENDPOINT_VERSION:1}
ogonggo.posthog.endpoints.connect-timeout=2s
ogonggo.posthog.endpoints.read-timeout=8s
ogonggo.posthog.endpoints.cache-ttl=60s
ogonggo.posthog.endpoints.page-size=1000
ogonggo.posthog.endpoints.max-rows=20000
