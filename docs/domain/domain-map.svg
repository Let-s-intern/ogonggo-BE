  <text x="40" y="56" font-size="28" font-weight="800" fill="#101828">오공고 도메인 개념도</text>
  <text x="40" y="86" font-size="14" fill="#667085">핵심 개념과 개념 사이의 관계를 개수와 함께 보여 줍니다. 엔티티끼리는 JPA 연관관계 없이 식별자로만 참조합니다.</text>

