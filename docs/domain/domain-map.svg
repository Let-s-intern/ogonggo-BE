<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1190" width="1600" height="1190" role="img" aria-label="오공고 도메인 개념도: 회원을 중심으로 채용공고·부트캠프, 모집글·취준고민 개념과 그 사이의 관계와 개수를 보여 준다." font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="1600" height="1190" fill="#ffffff"/>

