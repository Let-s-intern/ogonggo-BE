    <text x="365" y="1050" text-anchor="middle">소식 보관</text>
    <text x="985" y="1050" text-anchor="middle">개별 주소 / 토픽 1건</text>
    <text x="40" y="1130">개인 알림은 회원별 보관. 전체 토픽 공지는 NotificationBatch 한 건을 함께 조회하고 읽은 회원만 NotificationBroadcastRead에 기록합니다.</text>
    <text x="40" y="1152">토큰이 없으면 알림함만 보관합니다. 푸시 접수·실패는 읽음 상태를 바꾸지 않으며, 기존 일반 발송의 알림함 연결은 선택입니다.</text>
  </g>
  <g font-size="12" font-weight="800" fill="#344054">
    <text x="250" y="1082">1</text><text x="475" y="1082">N</text>
    <text x="860" y="1082">1</text><text x="1080" y="1082">0..N</text>
  </g>
</svg>
