<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1180" width="1700" height="1180" role="img" aria-label="오공고 도메인 개념도: 기업 회원은 채용공고·부트캠프를 등록하고, 관리자는 기업 콘텐츠를 검수하고 오늘의 공고를 고르며, 일반 회원은 콘텐츠를 북마크하고 지원 단계를 관리하고 모집글·취준고민을 쓴다. 렛츠커리어 콘텐츠는 공고마다 맞춰 추천된다. 기업 담당자는 회원이 아니어도 광고 문의를 남기고, 관리자가 처리 상태와 메모를 바꾼다." font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475467"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#98a2b3"/>
    </marker>
  </defs>
  <rect width="1700" height="1180" fill="#ffffff"/>

  <!-- 제목 -->
  <text x="40" y="56" font-size="28" font-weight="800" fill="#101828">오공고 도메인 개념도</text>
  <text x="40" y="86" font-size="14" fill="#667085">핵심 개념과 개념 사이의 관계를 보여 줍니다. 화살표는 "누가 → 무엇을 한다 → 무엇을"로 읽습니다.</text>

  <!-- 범례 -->
  <g font-size="12" fill="#475467">
    <line x1="1190" y1="34" x2="1240" y2="34" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1252" y="38">관계 (주어 → 목적어), 회색 글씨는 개수와 조건</text>
    <line x1="1190" y1="56" x2="1240" y2="56" stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-muted)"/>
    <text x="1252" y="60">저장하지 않는 관계, 점선 상자는 외부 시스템</text>
    <rect x="1190" y="70" width="50" height="18" rx="5" fill="#fffaeb" stroke="#fdb022" stroke-width="1.2"/>
    <text x="1252" y="84">관계에 딸린 값 (북마크·지원마다 하나씩 가짐)</text>
    <rect x="1190" y="94" width="50" height="16" rx="5" fill="#ffffff" stroke="#101828" stroke-width="2"/>
    <text x="1252" y="107">중심 개념 · 영역 테두리로 가는 화살표는 영역 안 개념 모두에 해당</text>
  </g>

  <!-- ================= 영역 ================= -->
  <rect x="40" y="120" width="560" height="490" rx="18" fill="#f5f8ff" stroke="#c7d7fe" stroke-width="1.5"/>
  <text x="60" y="150" font-size="15" font-weight="800" fill="#1d4ed8">채용 콘텐츠</text>
  <text x="160" y="150" font-size="12" fill="#667085">회원은 읽고 저장하며, 지원은 원문에서 한다</text>

  <rect x="720" y="120" width="500" height="610" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="740" y="150" font-size="15" font-weight="800" fill="#6d28d9">회원</text>
  <text x="784" y="150" font-size="12" fill="#667085">한 계정(<tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11">User</tspan>)을 역할로 나눈다</text>


  <!-- ================= 관계선 ================= -->
  <g fill="none" stroke="#475467" stroke-width="1.5">
    <!-- 채용 콘텐츠 내부 -->
    <line x1="330" y1="230" x2="252" y2="230" marker-end="url(#arrow)"/>
    <line x1="450" y1="270" x2="450" y2="318" marker-end="url(#arrow)"/>
    <!-- 회원 → 채용 콘텐츠 -->
    <line x1="760" y1="205" x2="602" y2="205" marker-end="url(#arrow)"/>
    <line x1="760" y1="335" x2="572" y2="335" marker-end="url(#arrow)"/>
    <line x1="760" y1="385" x2="602" y2="385" marker-end="url(#arrow)"/>
    <line x1="760" y1="510" x2="602" y2="510" marker-end="url(#arrow)"/>
    <!-- 회원 내부 -->
    <line x1="960" y1="205" x2="1008" y2="205" marker-end="url(#arrow)"/>
    <line x1="845" y1="560" x2="845" y2="608" marker-end="url(#arrow)"/>
    <!-- 일반 회원 → 모집글·취준고민 -->
    <line x1="960" y1="470" x2="1308" y2="470" marker-end="url(#arrow)"/>
    <line x1="960" y1="512" x2="1308" y2="512" marker-end="url(#arrow)"/>
    <path d="M960,552 H1240 V655 H1308" marker-end="url(#arrow)"/>
    <!-- 댓글·답변 -->
    <line x1="1520" y1="485" x2="1482" y2="485" marker-end="url(#arrow)"/>
    <line x1="1520" y1="655" x2="1482" y2="655" marker-end="url(#arrow)"/>
    <!-- 외부 수집 → 채용 콘텐츠 -->
    <line x1="170" y1="820" x2="170" y2="612" marker-end="url(#arrow)"/>
    <!-- 일반 회원 → 렛츠커리어 -->
    <path d="M760,548 H740 V840 H778" marker-end="url(#arrow)"/>
    <!-- 회원(비회원 포함) → 광고 문의, 관리자 → 광고 문의 -->
    <line x1="1222" y1="230" x2="1308" y2="230" marker-end="url(#arrow)"/>
    <path d="M960,370 H1410 V282" marker-end="url(#arrow)"/>
  </g>
  <g fill="none" stroke="#98a2b3" stroke-width="1.5" stroke-dasharray="5 4">
    <line x1="380" y1="820" x2="380" y2="612" marker-end="url(#arrow-muted)"/>
    <path d="M1000,800 V585 H945 V562" marker-end="url(#arrow-muted)"/>
    <line x1="780" y1="868" x2="572" y2="868" marker-end="url(#arrow-muted)"/>
  </g>
