# /health 컨트롤러의 HealthEndpoint와 운영 metrics를 등록한다. Security는 metrics의 loopback 요청만 허용한다.
management.endpoints.web.exposure.include=health,metrics

# 운영 경고 웹훅은 비밀값으로 주입한다. 활성화와 수신처 설정을 모두 해야 전송한다.
ogonggo.slack.notification-alerts=${OGONGGO_NOTIFICATION_ALERT_WEBHOOK:}
ogonggo.notification.alerts.enabled=${OGONGGO_NOTIFICATION_ALERTS_ENABLED:false}
ogonggo.notification.alerts.environment=${OGONGGO_ENVIRONMENT:unknown}
ogonggo.notification.alerts.instance-id=${HOSTNAME:unknown}

# PROCESSING stale 복구는 provider 요청 시작 시각을 기준으로 적용한다.
ogonggo.notification.processing.nhn-alim-talk.stale-timeout=8m
ogonggo.notification.processing.nhn-alim-talk.stale-action=RETRY_WITH_IDEMPOTENCY
ogonggo.notification.processing.nhn-alim-talk.idempotency-window=10m
ogonggo.notification.processing.nhn-alim-talk.max-recovery-retries=1
ogonggo.notification.processing.email-smtp.stale-timeout=8m
ogonggo.notification.processing.email-smtp.stale-action=MARK_UNKNOWN
ogonggo.notification.processing.firebase-fcm.stale-timeout=8m
ogonggo.notification.processing.firebase-fcm.stale-action=MARK_UNKNOWN

# 이미지 업로드(POST /api/v1/images) 한도는 ImageFileValidator의 10 MiB와 맞춘다. 기본값(1MB)이면 1MB가 넘는 사진이 IMAGE_FILE_TOO_LARGE로 막힌다.
# 요청 전체는 multipart 경계·헤더 몫을 더해 조금 크게 둔다.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
